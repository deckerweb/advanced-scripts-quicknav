name: Validate and build package
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Focused release checks
        run: |
          php tests/smoke.php
          php tests/release-notes.php
          php tests/components.php
          php tests/older-updater.php
      - name: Build plugin package
        run: python3 tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: advanced-scripts-quicknav-package
          path: dist/
